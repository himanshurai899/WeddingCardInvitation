<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bag print 18x18</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Tiro+Devanagari+Hindi&family=Yatra+One&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  /* 1800 css px = 18 in. Rendered at 3x = 5400 px = 300 DPI. Safe margin 150px = 1.5 in. */
  :root { --gold:#c9a24b; --gold-bright:#e0b45f; --gold-pale:#f7e2a8; --marigold:#e8821e; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1800px; height: 1800px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 50% 38%, #24387a 0%, #17255a 38%, #0f1838 70%, #0b1230 100%);
    color: var(--gold-pale);
    font-family: 'Cormorant Garamond', Georgia, serif;
    position: relative;
  }
  /* soft stars, kept simple and symmetric-ish */
  .stars { position:absolute; inset:0;
    background-image:
      radial-gradient(2px 2px at 12% 14%, #f7e2a8 60%, transparent 62%),
      radial-gradient(3px 3px at 88% 10%, #f7e2a8 60%, transparent 62%),
      radial-gradient(2px 2px at 8% 52%, #f7e2a8 60%, transparent 62%),
      radial-gradient(3px 3px at 93% 47%, #f7e2a8 60%, transparent 62%),
      radial-gradient(2px 2px at 15% 88%, #f7e2a8 60%, transparent 62%),
      radial-gradient(2px 2px at 85% 90%, #f7e2a8 60%, transparent 62%),
      radial-gradient(2px 2px at 5% 30%, #f7e2a8 60%, transparent 62%),
      radial-gradient(2px 2px at 95% 72%, #f7e2a8 60%, transparent 62%);
    opacity:.7; }

  .frame { position:absolute; inset:150px; border:6px solid var(--gold); }
  .frame::before { content:""; position:absolute; inset:16px; border:2px solid var(--gold-bright); opacity:.8; }
  .frame i { position:absolute; width:34px; height:34px; background:var(--gold-bright); transform:rotate(45deg); }
  .frame i:nth-child(1){ left:-20px; top:-20px; }
  .frame i:nth-child(2){ right:-20px; top:-20px; }
  .frame i:nth-child(3){ left:-20px; bottom:-20px; }
  .frame i:nth-child(4){ right:-20px; bottom:-20px; }

  .content { position:absolute; inset:150px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 60px; }

  .om { font-family:'Yatra One','Tiro Devanagari Hindi',serif; font-size:54px; letter-spacing:6px; color:var(--gold-bright); margin-bottom:28px; }

  .medallion { width:420px; height:420px; border-radius:50%; border:10px solid var(--gold);
    box-shadow: 0 0 0 14px #0f1838, 0 0 0 18px var(--gold-bright), 0 0 90px rgba(232,130,30,.35);
    overflow:hidden; }
  .medallion img { width:100%; height:100%; object-fit:cover; object-position:50% 50%; display:block; }

  .mono { width:1380px; height:auto; display:block; margin-top:10px; }

  .names { margin-top:20px; font-size:84px; font-weight:500; letter-spacing:10px; text-transform:uppercase; color:var(--gold-pale); }
  .names em { font-family:'Great Vibes',cursive; font-style:normal; text-transform:none; font-size:84px; letter-spacing:0; color:var(--marigold); margin:0 18px; }

  .rule { display:flex; align-items:center; gap:22px; margin:24px 0 20px; }
  .rule b { width:260px; height:3px; background:linear-gradient(90deg,transparent,var(--gold-bright)); }
  .rule b:last-child { transform:scaleX(-1); }
  .rule i { width:18px; height:18px; background:var(--gold-bright); transform:rotate(45deg); }

  .when { font-family:'Nunito Sans',sans-serif; font-weight:600; font-size:42px; letter-spacing:12px; text-transform:uppercase; color:var(--gold-bright); }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="frame"><i></i><i></i><i></i><i></i></div>
